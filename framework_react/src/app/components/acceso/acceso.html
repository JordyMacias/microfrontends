<div class="acceso-container">
  <div class="acceso-card">
    <!-- Tabs Navigation -->
    <div class="tabs">
      <button 
        class="tab-button" 
        [class.active]="currentTab === 'login'"
        (click)="currentTab = 'login'">
        Iniciar Sesión
      </button>
      <button 
        class="tab-button" 
        [class.active]="currentTab === 'register'"
        (click)="currentTab = 'register'">
        Registrarse
      </button>
      <button 
        class="tab-button" 
        [class.active]="currentTab === 'recover'"
        (click)="currentTab = 'recover'">
        Recuperar Contraseña
      </button>
    </div>

    <!-- Login Form -->
    <div *ngIf="currentTab === 'login'" class="form-container">
      <h2>Iniciar Sesión</h2>
      <form (ngSubmit)="onLogin()" #loginForm="ngForm">
        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input 
            type="email" 
            id="email" 
            name="email"
            [(ngModel)]="loginData.email"
            required
            placeholder="tu@email.com">
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input 
            type="password" 
            id="password" 
            name="password"
            [(ngModel)]="loginData.password"
            required
            placeholder="••••••••">
        </div>
        <div class="form-options">
          <label class="checkbox">
            <input type="checkbox" [(ngModel)]="loginData.remember">
            <span>Recordarme</span>
          </label>
          <a (click)="currentTab = 'recover'" class="link">¿Olvidaste tu contraseña?</a>
        </div>
        <button type="submit" class="btn-primary" [disabled]="!loginForm.valid">
          Iniciar Sesión
        </button>
      </form>
      <div class="divider">
        <span>o</span>
      </div>
      <button class="btn-secondary" routerLink="/menu">
        Continuar como invitado
      </button>
    </div>

    <!-- Register Form -->
    <div *ngIf="currentTab === 'register'" class="form-container">
      <h2>Crear Cuenta</h2>
      <form (ngSubmit)="onRegister()" #registerForm="ngForm">
        <div class="form-group">
          <label for="reg-name">Nombre Completo</label>
          <input 
            type="text" 
            id="reg-name" 
            name="name"
            [(ngModel)]="registerData.name"
            required
            placeholder="Juan Pérez">
        </div>
        <div class="form-group">
          <label for="reg-email">Correo Electrónico</label>
          <input 
            type="email" 
            id="reg-email" 
            name="email"
            [(ngModel)]="registerData.email"
            required
            placeholder="tu@email.com">
        </div>
        <div class="form-group">
          <label for="reg-password">Contraseña</label>
          <input 
            type="password" 
            id="reg-password" 
            name="password"
            [(ngModel)]="registerData.password"
            required
            minlength="6"
            placeholder="••••••••">
        </div>
        <div class="form-group">
          <label for="reg-confirm">Confirmar Contraseña</label>
          <input 
            type="password" 
            id="reg-confirm" 
            name="confirmPassword"
            [(ngModel)]="registerData.confirmPassword"
            required
            placeholder="••••••••">
        </div>
        <div class="form-group checkbox">
          <label>
            <input type="checkbox" [(ngModel)]="registerData.acceptTerms" required>
            <span>Acepto los términos y condiciones</span>
          </label>
        </div>
        <button type="submit" class="btn-primary" [disabled]="!registerForm.valid">
          Registrarse
        </button>
      </form>
    </div>

    <!-- Recover Password Form -->
    <div *ngIf="currentTab === 'recover'" class="form-container">
      <h2>Recuperar Contraseña</h2>
      <p class="recover-description">
        Ingresa tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña.
      </p>
      <form (ngSubmit)="onRecover()" #recoverForm="ngForm">
        <div class="form-group">
          <label for="recover-email">Correo Electrónico</label>
          <input 
            type="email" 
            id="recover-email" 
            name="email"
            [(ngModel)]="recoverData.email"
            required
            placeholder="tu@email.com">
        </div>
        <button type="submit" class="btn-primary" [disabled]="!recoverForm.valid">
          Enviar Enlace de Recuperación
        </button>
      </form>
      <div class="back-link">
        <a (click)="currentTab = 'login'" class="link">← Volver a Iniciar Sesión</a>
      </div>
    </div>
  </div>
</div>
